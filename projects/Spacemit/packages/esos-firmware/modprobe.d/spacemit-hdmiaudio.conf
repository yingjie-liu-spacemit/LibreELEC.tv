# The HDMI audio (SSPA) block lives in the audio power domain, which is only
# switched on once the RCPU remoteproc has booted its firmware (esos.elf).
# Its DMA channel is also provided by that firmware (rpmsg "adma-service").
#
# A softdep is not enough: k1x-rproc boots the firmware asynchronously, so
# spacemit-hdmiaudio could still probe too early, and the HDMI sound card
# then failed with -EBUSY (no DMA channel yet).
# Load k1x-rproc, wait (at most 10 s) until adma-service is bound, and only
# then load spacemit-hdmiaudio. If adma-service never shows up, do not load
# spacemit-hdmiaudio at all: touching the audio reset while the power domain
# is still off hangs the bus. No HDMI audio is better than an RCU stall.
# The glob is checked in a for loop, so several matching rpmsg devices
# cannot break the test.
install spacemit_hdmiaudio \
  /sbin/modprobe k1x-rproc; \
  i=0; ready=0; \
  while [ ${i} -lt 100 ]; do \
    for d in /sys/bus/rpmsg/devices/virtio0.adma-service.*/driver; do \
      [ -e "${d}" ] && { ready=1; break; }; \
    done; \
    [ ${ready} -eq 1 ] && break; \
    sleep 0.1; i=$((i + 1)); \
  done; \
  [ ${ready} -eq 1 ] || { \
    echo "spacemit-hdmiaudio: RCPU adma-service not ready, skipping" > /dev/kmsg; \
    exit 1; }; \
  /sbin/modprobe --ignore-install spacemit_hdmiaudio $CMDLINE_OPTS
